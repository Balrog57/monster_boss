# docker-compose.yml - Boss Monster (app + Postgres)
#
# Deploy on ZimaOS:
#   cd /DATA/AppData/boss-monster
#   DOCKER_CONFIG=/DATA/.docker-root docker compose up -d --build
#
# Access: http://192.168.1.98:8090
#
services:
  db:
    image: postgres:16-alpine
    container_name: boss-monster-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=boss
      - POSTGRES_PASSWORD=boss
      - POSTGRES_DB=bossmonster
      - TZ=Europe/Paris
    volumes:
      - boss_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boss -d bossmonster"]
      interval: 15s
      timeout: 5s
      retries: 5

  boss-monster:
    build: .
    image: boss-monster:latest
    container_name: boss-monster
    restart: unless-stopped
    ports:
      - "8090:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - DATABASE_URL=postgres://boss:boss@db:5432/bossmonster
      - TZ=Europe/Paris
      # Optional tuning:
      - STALE_MATCH_MS=3600000
      - CLEANUP_INTERVAL_MS=1800000
      - MAX_MOVES_PER_SEC=10
      - FLUSH_INTERVAL_MS=5000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  boss_db: