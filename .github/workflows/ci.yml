name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version
      # Sans import, les class_name globaux (BossEngine, Match, CardUI...) sont inconnus : "Parse Error: Identifier not declared".
      - name: Import the Godot project
        run: godot --headless --path src/frontend --import || true
      # Parite APK (tools/parity/apk.py) : locale uniquement, elle exige l'oracle .NET (DBMGame.dll de apk-original/, non versionne).
      - name: Godot suites
        run: python3 tools/run_godot_tests.py

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (Godot web export + nginx)
        run: docker build -f deploy/Dockerfile -t boss-monster-web:ci .
      - name: Run container
        run: |
          docker run -d --name bm -p 8090:80 boss-monster-web:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8090/ >/dev/null && exit 0
            sleep 1
          done
          echo "nginx did not answer within 30 s"
          exit 1
      - name: Assert served export
        run: |
          base=http://127.0.0.1:8090
          fail() { echo "FAIL: $*"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/index.html")
          [ "$code" = 200 ] || fail "index.html returned $code"

          wasm_headers=$(curl -sI -H 'Accept-Encoding: gzip' "$base/index.wasm")
          echo "$wasm_headers"
          echo "$wasm_headers" | grep -iq '^content-type: *application/wasm' || fail "index.wasm Content-Type is not application/wasm"
          echo "$wasm_headers" | grep -iq '^content-encoding: *gzip' || fail "index.wasm Content-Encoding is not gzip"

          size=$(curl -s -o /dev/null -w '%{size_download}' "$base/index.pck")
          echo "index.pck uncompressed size: $size"
          [ "$size" -gt 20000000 ] || fail "index.pck too small ($size bytes)"

          pck_headers=$(curl -sI "$base/index.pck")
          echo "$pck_headers" | grep -iq '^cache-control: *no-cache' || fail "index.pck lacks Cache-Control: no-cache"

          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/index.service.worker.js")
          [ "$code" = 404 ] || fail "index.service.worker.js returned $code (expected 404, PWA disabled)"
      - name: Container logs
        if: always()
        run: docker logs bm

