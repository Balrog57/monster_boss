# deploy/docker-compose.yml - Boss Monster (client Godot web servi par nginx, statique)
#
# Deploy on homelab (from the repo root):
#   cd /DATA/AppData/boss-monster
#   DOCKER_CONFIG=/DATA/.docker-root docker compose -f deploy/docker-compose.yml up -d --build
#   (si permission refusée : mkdir -p /tmp/dockercfg-bm && DOCKER_CONFIG=/tmp/dockercfg-bm docker compose ...)
#
# Access: http://192.168.1.98:8090
#
# Le service serveur multijoueur Godot (headless) sera ajouté ici plus tard.
name: boss-monster
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: boss-monster-web:latest
    container_name: boss-monster-web
    restart: unless-stopped
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

x-casaos:
  author: self
  category: Games
  hostname: 192.168.1.98
  icon: data:image/png;base64,
  index: /
  is_uncontrolled: false
  main: web
  port_map: "8090"
  scheme: http
  store_app_id: boss-monster
  title:
    custom: "Boss Monster"
    en_us: "Boss Monster"
