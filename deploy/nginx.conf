server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sert index.wasm.gz / index.pck.gz / index.js.gz pré-compressés (gzip -9 au build)
    # en gardant le Content-Type d'origine (requis par WebAssembly.instantiateStreaming).
    gzip_static on;
    gzip_proxied any;   # le tunnel Cloudflare peut ajouter un en-tête Via
    gzip_vary on;

    # Petits fichiers (index.html, json, css) compressés à la volée.
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Noms non hashés (index.pck, index.wasm) : toujours revalider (ETag -> 304 bon marché).
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Le proxy /ws vers le serveur multijoueur Godot sera ajouté avec ce serveur
    # (un proxy_pass vers un hôte inexistant empêcherait nginx de démarrer).
}
