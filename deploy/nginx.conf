# --- Protection du multijoueur (lot 3.1) ------------------------------------------------------------------
# IP du visiteur : derriere le tunnel Cloudflare (ou tout proxy local), $remote_addr serait l'adresse du tunnel, donc la meme pour
# tous les joueurs, et les limites ci-dessous les mettraient dans le meme panier. On lit CF-Connecting-IP, mais seulement quand la
# connexion arrive d'une adresse privee/locale (cloudflared sur l'hote ou le LAN) : un visiteur Internet direct ne peut pas la forger.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# Limites par IP. /ws : une requete = une ouverture de connexion WebSocket (les messages sont limites par le serveur : 60/s par
# connexion). Valeurs larges pour un jeu (un foyer, plusieurs onglets, reconnexions toutes les secondes au pire), serrees pour un abus.
limit_conn_zone $binary_remote_addr zone=bm_conn:10m;
limit_req_zone  $binary_remote_addr zone=bm_ws:10m   rate=5r/s;
limit_req_zone  $binary_remote_addr zone=bm_http:10m rate=30r/s;
limit_conn_status 429;
limit_req_status 429;

# Origin de /ws : refuse (403) toute origine de navigateur differente de l'hote de la page (anti cross-site WebSocket hijacking).
# Sans en-tete Origin (curl, test CI, client non navigateur) : accepte, un navigateur en envoie toujours un. Le serveur Godot
# n'expose pas les en-tetes du handshake (WebSocketPeer.get_handshake_headers() est vide cote serveur) : le controle ne peut etre qu'ici.
# La cle est "<Origin>|<Host>" : l'origine doit etre http(s)://<Host tel que recu, port compris> (\1 = le meme texte des deux cotes).
# Pour autoriser un autre site, ajouter une ligne, par exemple :   "~*^https://jeu\.example\.org\|"   1;
map "$http_origin|$http_host" $ws_origin_ok {
    default                         0;
    "~^\|"                          1;
    "~*^https?://([^|]+)\|\1$"      1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Sert index.wasm.gz / index.pck.gz / index.js.gz pré-compressés (gzip -9 au build)
    # en gardant le Content-Type d'origine (requis par WebAssembly.instantiateStreaming).
    gzip_static on;
    gzip_proxied any;   # le tunnel Cloudflare peut ajouter un en-tête Via
    gzip_vary on;

    # Petits fichiers (index.html, json, css) compressés à la volée.
    gzip on;
    gzip_types text/css application/javascript application/json;

    # Noms non hashés (index.pck, index.wasm) : toujours revalider (ETag -> 304 bon marché).
    add_header Cache-Control "no-cache" always;

    # Site statique : plafond large (un chargement du jeu = une dizaine de fichiers).
    limit_req zone=bm_http burst=100 nodelay;
    limit_conn bm_conn 50;

    location / {
        try_files $uri $uri/ =404;
    }

    # Multijoueur : WebSocket proxifié vers le serveur Godot (service compose `server`).
    # Le resolver Docker + la variable évitent que nginx refuse de démarrer si `server`
    # est arrêté ou pas encore résolvable (le /ws répond alors 502 jusqu'à son retour).
    location = /ws {
        if ($ws_origin_ok = 0) {
            return 403;
        }
        limit_req zone=bm_ws burst=20 nodelay;   # 5 ouvertures/s en regime, 20 d'avance : couvre une salle de 6 qui se reconnecte
        limit_conn bm_conn 20;                    # 20 liaisons ouvertes simultanees par IP
        resolver 127.0.0.11 valid=10s;
        set $ws http://server:8091;
        proxy_pass $ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
